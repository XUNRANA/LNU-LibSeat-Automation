name: CI

# push 到主分支或任意 PR 时跑测试 + lint。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # import main 会经 logic.booker 链路拉起 OpenCV(cv2)，Linux 上需要 libGL。
      - name: Install system libs for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # config.py 含敏感信息、已被 .gitignore 忽略；CI 无此文件，
      # 从模板生成以满足 import config 的测试模块。
      - name: Prepare config from template
        run: cp config.example.py config.py

      # 排除 smoke 标记：那些用例会启动真实浏览器，headless runner 无显示环境跑不了。
      - name: Run tests
        run: python -m pytest tests/ -q -m "not smoke"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      # 阻塞门槛：只挑真 bug 类规则（语法错误、未定义名、f-string 误用等），
      # 旧代码库尚未整体 lint，先不让风格问题卡构建。
      - name: Ruff (blocking, real-bug rules)
        run: ruff check --select E9,F63,F7,F82 .

      # 全量风格报告：非阻塞，仅作可见性，便于后续逐步收敛。
      - name: Ruff (full report, non-blocking)
        run: ruff check .
        continue-on-error: true

  # 类型检查：非阻塞。旧代码库缺类型标注，先用报告形式暴露问题、逐步收敛，
  # 不让类型告警卡构建（与 ruff 全量报告同一策略）。
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mypy
        run: pip install mypy

      # --ignore-missing-imports：第三方包(PySide6/selenium/cv2 等)多无类型存根，
      # 不为缺存根报错。仅检查本仓库自身代码的类型一致性。
      - name: Mypy (non-blocking)
        run: mypy --ignore-missing-imports --exclude '(\.build_venv|dist|build|train)' .
        continue-on-error: true
