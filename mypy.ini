[mypy]
# Third-party packages (PySide6 / selenium / cv2 / ddddocr ...) ship no type
# stubs; do not error on missing imports.
ignore_missing_imports = True

# Exclude build artifacts, training code, and config data files
# (config.py is generated locally; neither is business logic to type-check).
# NOTE: keep this file ASCII-only -- configparser reads it with the locale
# codec on Windows (GBK), so non-ASCII comments crash mypy.
exclude = (?x)(
    ^\.build_venv/
    | ^dist/
    | ^build/
    | ^train/
    | ^config\.py$
    | ^config\.example\.py$
  )
